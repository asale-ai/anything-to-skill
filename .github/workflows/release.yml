name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per target where one exists — the dependency tree has
          # no C build scripts, so nothing here needs `cross` or a sysroot.
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel macOS cross-compiles from the ARM runner rather than using
          # `macos-13`. GitHub is retiring the Intel runners and a job asking
          # for one can sit queued indefinitely without ever starting — this
          # release stalled for 20 minutes on exactly that. Apple ships a
          # universal SDK, so with no C build scripts in the tree the
          # cross-compile is as ordinary as a native build.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl builds are statically linked, so one binary runs on any Linux
      # including Alpine — worth the extra targets.
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The tag is the single source of the version, so a release archive can
      # never disagree with the tag it was built from.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="anything-to-skill-${{ steps.version.outputs.number }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/anything-to-skill" "dist/${name}/"
          cp README.md SKILL.md SECURITY.md LICENSE "dist/${name}/"
          # SKILL.md links into references/, so the two travel together — a
          # skill whose links go nowhere is worse than one that never had them.
          cp -R references "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Checksums are recorded against the bare filename so `sha256sum -c`
          # works from the directory the user downloaded into.
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "anything-to-skill-${{ steps.version.outputs.number }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/anything-to-skill.exe" "dist/$name/"
          Copy-Item README.md, SKILL.md, SECURITY.md, LICENSE "dist/$name/"
          # SKILL.md links into references/, so the two travel together.
          Copy-Item -Recurse references "dist/$name/references"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # Two spaces before the filename — the format `sha256sum -c` expects.
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
          "" | Out-File -Encoding ascii -Append "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One SHA256SUMS covering every archive is easier to verify against than
      # seven separate files, but both are published.
      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          echo "--- release contents ---"
          ls -la

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/asale-ai/anything-to-skill/main/install.sh | sh
            ```

            Windows, in PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/asale-ai/anything-to-skill/main/install.ps1 | iex
            ```

            Or download the archive for your platform below and put
            `anything-to-skill` on your `PATH`.

            | Platform | Archive |
            |---|---|
            | macOS (Apple Silicon) | `aarch64-apple-darwin` |
            | macOS (Intel) | `x86_64-apple-darwin` |
            | Linux x86-64 | `x86_64-unknown-linux-gnu` |
            | Linux x86-64 (static) | `x86_64-unknown-linux-musl` |
            | Linux ARM64 | `aarch64-unknown-linux-gnu` |
            | Linux ARM64 (static) | `aarch64-unknown-linux-musl` |
            | Windows x86-64 | `x86_64-pc-windows-msvc` |

            The `musl` builds are statically linked and run on any Linux,
            including Alpine.

            Verify a download against `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

  # npm is published from here over OIDC (npm trusted publishing), so no npm
  # token exists anywhere: not in a repository secret, not in a maintainer's
  # .env. The trusted publisher is configured on the package's /access page and
  # names this repository and this file by name — renaming either one stops
  # publishing until the npm side is changed to match.
  npm:
    name: Publish to npm
    # After the binaries and the GitHub release exist: the published package
    # downloads the release for its own version during postinstall, so shipping
    # it earlier would put a version on npm that cannot install itself.
    needs: release
    # Only a tag push carries the version this job publishes; on
    # workflow_dispatch github.ref is the branch. A skipped job does not fail
    # the run, which is why publish.sh confirms the version reached the
    # registry instead of reading it off a green workflow.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the publishing credential itself, not an extra permission: npm
      # verifies the OIDC token GitHub mints for this job.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url: setup-node would write an .npmrc
      # referencing NODE_AUTH_TOKEN, which does not exist on the OIDC path, and
      # npm would authenticate with an empty string instead of the token it
      # minted for itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1. An older npm fails with a plain
      # "need auth" and never mentions its version, so this is not belt and
      # braces — without it the failure is unreadable.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./npm/package.json').version")
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag but npm/package.json says $pkg"
            exit 1
          }

      # The package's `files` list names LICENSE, and this repository keeps one
      # licence at the root rather than a copy per package directory. Without
      # this the tarball declares Apache-2.0 and carries no licence text.
      - name: Stage LICENSE
        run: cp LICENSE npm/LICENSE

      - name: Publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./npm/package.json').name")
          # Ask the real registry, never a mirror: re-running a tag is an
          # ordinary thing to do, and this is what makes that safe.
          if npm view "$name@$version" version \
               --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$name@$version is already on npm — nothing to do"
            exit 0
          fi
          # --provenance is passed explicitly. The docs say trusted publishing
          # implies it; in practice the publish fails without the flag.
          cd npm && npm publish --provenance
