name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

      # The Windows installer is only ever run from a raw URL, where a syntax
      # error is a broken install rather than a failed build. PowerShell is on
      # the Ubuntu image, so the parse costs nothing.
      - name: Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
              $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          Write-Host "install.ps1 parses clean"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # poppler is optional at runtime, but the PDF table path and `render`
      # only exercise fully when it is present — so CI installs it.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: cargo build --release

      - name: Extract a real PDF
        run: |
          set -euo pipefail
          # A two-column paper with borderless tables — the shape that broke
          # every single-strategy extractor we tested.
          curl -fsSL --retry 3 -o paper.pdf https://arxiv.org/pdf/1706.03762v7
          ./target/release/anything-to-skill extract paper.pdf --out ./work

          # The extraction has to actually contain the document, not just exist.
          test -s ./work/full_text.txt
          grep -q "Attention Is All You Need" ./work/full_text.txt
          # Reading order: this sentence spans a line break in the source, so it
          # only appears intact when columns and hyphenation were handled.
          grep -q "positional encodings" ./work/full_text.txt

      - name: Report says what it did
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          meta = json.load(open("./work/metadata.json"))
          assert meta["estimated_tokens"] > 5000, meta["estimated_tokens"]
          assert meta["files"], "no files in report"
          assert meta["files"][0]["page_count"] == 15, meta["files"][0]["page_count"]
          print("ok:", meta["estimated_tokens"], "tokens,",
                meta["structure"]["chapters_detected"], "chapters")
          EOF

      - name: Subcommands run
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill check
          ./target/release/anything-to-skill formats | grep -q epub
          ./target/release/anything-to-skill sources | grep -q 'documentation site'
          ./target/release/anything-to-skill render paper.pdf --pages 1 --out ./png
          test -n "$(find ./png -name '*.png')"

      # `audit` is the one command with no model, no key and no network, so CI
      # can hold it to the standard it holds everybody else to: this repo's own
      # skill has to pass its own audit, warnings included.
      - name: The project's own skill passes its own audit
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill audit . --strict
          ./target/release/anything-to-skill audit . --json | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          skill = report['skills'][0]
          assert report['errors'] == 0 and report['warnings'] == 0, report
          # The body has to stay a map: the detail lives in references/.
          assert skill['on_trigger_tokens'] < 2000, skill['on_trigger_tokens']
          assert skill['reference_files'] > 0, skill
          assert skill['on_demand_tokens'] > skill['on_trigger_tokens'], skill
          print('ok:', skill['always_loaded_tokens'], 'tokens always loaded')
          "

      - name: audit catches a broken skill
        run: |
          set -euo pipefail
          mkdir -p ./bad/broken
          printf -- '---\nname: broken\ndescription: Utilities.\n---\nSee [it](references/gone.md).\n' \
            > ./bad/broken/SKILL.md
          if ./target/release/anything-to-skill audit ./bad; then
            echo "expected a non-zero exit on a broken skill" >&2
            exit 1
          fi
          # It exits non-zero by design, which `pipefail` would read as the
          # grep having failed — so take the report first, then look at it.
          ./target/release/anything-to-skill audit ./bad --json > ./bad.json || true
          grep -q 'broken-reference-link' ./bad.json

      # `build` needs a key, but everything up to the first request does not.
      - name: build plans a run without a key
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill build README.md \
            --dry-run --name plan-test --out ./skills > ./plan.txt 2>&1
          cat ./plan.txt
          grep -q 'dry-run: stopping before the first request' ./plan.txt
          test ! -e ./skills/plan-test
          # Without --dry-run and without a key, it must fail before fetching.
          if ./target/release/anything-to-skill build README.md --out ./skills; then
            echo "expected a non-zero exit with no ANTHROPIC_API_KEY" >&2
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ''

      - name: refresh refuses a skill it did not build
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill refresh . --check > ./refresh.txt 2>&1 || true
          grep -q '.a2s.lock' ./refresh.txt

      - name: docling is asked for by name or not at all
        run: |
          set -euo pipefail
          printf '<html><body><h1>x</h1></body></html>' > page.html
          # Not installed on the runner, so the flag must fail loudly and say how.
          ./target/release/anything-to-skill extract page.html --engine docling \
            --out ./work-docling > ./docling.txt 2>&1 || true
          grep -q 'pip install docling' ./docling.txt
          # ... and the default must be untouched by its absence.
          ./target/release/anything-to-skill extract page.html --out ./work-builtin
          grep -q x ./work-builtin/full_text.txt

      - name: MCP speaks the protocol
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"extract","arguments":{"sources":["README.md"]}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"read_text","arguments":{"limit":80}}}' \
            | ./target/release/anything-to-skill mcp --work ./mcp-work > ./mcp.jsonl
          python3 - <<'EOF'
          import json
          replies = [json.loads(line) for line in open("./mcp.jsonl")]
          # A notification carries no id and must get no reply.
          assert [r["id"] for r in replies] == [1, 2, 3, 4], [r.get("id") for r in replies]
          assert replies[0]["result"]["serverInfo"]["name"] == "anything-to-skill"
          names = {t["name"] for t in replies[1]["result"]["tools"]}
          assert names == {"extract", "read_text", "audit", "sources"}, names
          assert replies[2]["result"]["isError"] is False, replies[2]
          assert "anything-to-skill" in replies[3]["result"]["content"][0]["text"]
          print("ok:", sorted(names))
          EOF

      # The web and repository paths only ever run against a real server, so a
      # unit test cannot cover them. Both targets are this repository itself.
      - name: Read a URL
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill extract \
            https://raw.githubusercontent.com/${{ github.repository }}/main/SKILL.md \
            --out ./work-url
          grep -q "Anything to Skill" ./work-url/full_text.txt

      - name: Read a repository
        run: |
          set -euo pipefail
          ./target/release/anything-to-skill extract \
            https://github.com/${{ github.repository }} --out ./work-repo
          # The README is read first, so it heads the output.
          head -1 ./work-repo/full_text.txt | grep -q "README.md"
          python3 - <<'EOF'
          import json
          meta = json.load(open("./work-repo/metadata.json"))
          assert meta["sources"][0]["kind"] == "repo", meta["sources"]
          assert meta["sources"][0]["documents"] > 1, meta["sources"]
          print("ok:", meta["sources"][0]["documents"], "documents")
          EOF

      - name: Unsupported input fails loudly
        run: |
          set -euo pipefail
          touch empty.xyz
          if ./target/release/anything-to-skill extract empty.xyz --out ./work2; then
            echo "expected a non-zero exit for an unsupported format" >&2
            exit 1
          fi
