<svg xmlns="http://www.w3.org/2000/svg" width="880" height="238" viewBox="0 0 880 238" lang="en" role="img" aria-label="anything-to-skill — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="238" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="237" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">ANYTHING-TO-SKILL</text>
  <rect x="28" y="60" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="84" font-size="13" fill="#edebfa" text-anchor="start">build</text>
  <text class="t" x="111" y="84" font-size="13" fill="#edebfa" text-anchor="start">一个来源进去，一个完整的 skill 出来 —— 一条命令，过程中没有 agent</text>
  <rect x="20" y="95" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="119" font-size="13" fill="#edebfa" text-anchor="start">audit</text>
  <text class="t" x="111" y="119" font-size="13" fill="#edebfa" text-anchor="start">一个 skill 在每次会话中让你付出多少代价，以及它到底会不会被触发</text>
  <text class="t" x="28" y="154" font-size="13" fill="#edebfa" text-anchor="start">eval</text>
  <text class="t" x="111" y="154" font-size="13" fill="#edebfa" text-anchor="start">用来源自己的问题去问这个 skill，看它能答对哪些</text>
  <rect x="20" y="165" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="189" font-size="13" fill="#edebfa" text-anchor="start">refresh</text>
  <text class="t" x="111" y="189" font-size="13" fill="#edebfa" text-anchor="start">文档变了；重新构建，并说清楚变了什么</text>
  <rect x="28" y="200" width="824" height="1" fill="#35334a"/>
</svg>
