<svg xmlns="http://www.w3.org/2000/svg" width="910" height="511" viewBox="0 0 910 511" lang="en" role="img" aria-label="terminal recording: anything-to-skill --help">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; white-space: pre; }
    svg {
      --d: 9.130s;
      --w0: 201.6px;
      --wlast: 201.6px;
    }
    .s0 { animation: s0 var(--d) step-end infinite; }
    @keyframes s0 { 0%,19.715% { opacity: 1 } 19.715%,19.715% { opacity: 0 } 19.715%,100% { opacity: 1 } }
    .c0 { animation: c0 var(--d) infinite; }
    @keyframes c0 {
      0% { transform: translateX(var(--w0)); animation-timing-function: step-end }
      19.715% { transform: translateX(0); animation-timing-function: steps(24, end) }
      31.544%,100% { transform: translateX(var(--w0)) }
    }
    .o0 { animation: o0 var(--d) step-end infinite; }
    @keyframes o0 { 0%,19.715% { opacity: 1 } 19.715%,38.664% { opacity: 0 } 38.664%,100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .step { opacity: 0 }
      .last { opacity: 1 }
      .cover { transform: translateX(var(--wlast)) }
    }
  </style>
  <rect x="0" y="0" width="910" height="511" rx="10.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="909" height="510" rx="9.5" fill="none" stroke="#35334a"/>
  <rect x="0" y="0" width="910" height="34" rx="10.0" fill="#222130"/>
  <rect x="0" y="17" width="910" height="17" rx="0.0" fill="#222130"/>
  <circle cx="20" cy="17" r="5" fill="#ff4f6e"/>
  <circle cx="38" cy="17" r="5" fill="#ffc53d"/>
  <circle cx="56" cy="17" r="5" fill="#43e5d0"/>
  <text class="t" x="455" y="22" font-size="12" fill="#8b87a3" text-anchor="middle">anything-to-skill</text>
  <g class="step s0 last">
    <text class="t" x="18" y="66.0" font-size="14" xml:space="preserve"><tspan fill="#ff5fd1">$</tspan><tspan fill="#edebfa"> anything-to-skill --help</tspan></text>
    <g class="cover c0"><rect x="34.8" y="52.0" width="890.4" height="21.0" fill="#1a1a24"/><rect x="34.8" y="54.0" width="8.4" height="17.0" fill="#ff5fd1" opacity="0.85"/></g>
    <g class="o0">
      <text class="t" x="18" y="94.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">Extract text from books and documents for agent skill generation</tspan></text>
      <text class="t" x="18" y="136.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa" font-weight="700">Usage:</tspan><tspan fill="#edebfa"> </tspan><tspan fill="#edebfa" font-weight="700">anything-to-skill</tspan><tspan fill="#edebfa"> &lt;COMMAND&gt;</tspan></text>
      <text class="t" x="18" y="178.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa" font-weight="700">Commands:</tspan></text>
      <text class="t" x="18" y="199.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">extract</tspan><tspan fill="#edebfa">  Extract text from files, web pages, documentation sites, or repositories</tspan></text>
      <text class="t" x="18" y="220.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">build</tspan><tspan fill="#edebfa">    Read a source and write the finished skill — extraction, reading and writing in one command,…</tspan></text>
      <text class="t" x="18" y="241.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">eval</tspan><tspan fill="#edebfa">     Ask the source&apos;s own questions of the skill, and see which it can answer</tspan></text>
      <text class="t" x="18" y="262.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">refresh</tspan><tspan fill="#edebfa">  Re-read a skill&apos;s sources and rebuild it if they have moved</tspan></text>
      <text class="t" x="18" y="283.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">mcp</tspan><tspan fill="#edebfa">      Serve the reading and grading tools over MCP, for agents with no shell</tspan></text>
      <text class="t" x="18" y="304.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">sources</tspan><tspan fill="#edebfa">  Explain every kind of source `extract` accepts</tspan></text>
      <text class="t" x="18" y="325.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">check</tspan><tspan fill="#edebfa">    Report which optional external tools are available</tspan></text>
      <text class="t" x="18" y="346.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">render</tspan><tspan fill="#edebfa">   Render specific PDF pages to PNG, for pages the extractor could not read</tspan></text>
      <text class="t" x="18" y="367.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">formats</tspan><tspan fill="#edebfa">  List every extension the tool accepts</tspan></text>
      <text class="t" x="18" y="388.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">audit</tspan><tspan fill="#edebfa">    Grade a skill, or a directory of them, for load cost and routability</tspan></text>
      <text class="t" x="18" y="409.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">help</tspan><tspan fill="#edebfa">     Print this message or the help of the given subcommand(s)</tspan></text>
      <text class="t" x="18" y="451.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa" font-weight="700">Options:</tspan></text>
      <text class="t" x="18" y="472.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">-h</tspan><tspan fill="#edebfa">, </tspan><tspan fill="#edebfa" font-weight="700">--help</tspan><tspan fill="#edebfa">     Print help</tspan></text>
      <text class="t" x="18" y="493.0" font-size="14" xml:space="preserve"><tspan fill="#edebfa">  </tspan><tspan fill="#edebfa" font-weight="700">-V</tspan><tspan fill="#edebfa">, </tspan><tspan fill="#edebfa" font-weight="700">--version</tspan><tspan fill="#edebfa">  Print version</tspan></text>
    </g>
  </g>
</svg>
